<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión · GEONET</title>
    <meta name="description" content="Acceso a la consola de gestión de red de GEONET." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Outfit:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="pantalla-acceso pantalla-acceso--partida">
    <section class="acceso-marca" aria-label="GEONET">
      <span class="logotipo acceso-marca__logo">
        <span class="logotipo__marca">
          <svg class="icono" aria-hidden="true"><use href="#i-marca" /></svg>
        </span>
        GEONET
      </span>
      <div class="acceso-marca__texto">
        <p class="acceso-marca__lema">Sabes qué pasa en tu red antes que tus clientes.</p>
        <p class="acceso-marca__detalle">Estado de cada nodo e incidencias al momento de iniciar sesión.</p>
      </div>
    </section>

    <div class="acceso-formulario" data-theme="light">
      <main class="tarjeta-acceso" data-theme="light">
        <header class="marca-acceso">
          <h1 class="marca-acceso__titulo">Iniciar sesión</h1>
          <p class="marca-acceso__lema">Accede a la consola de tu red</p>
        </header>

        <form class="formulario-acceso" id="form-login" novalidate>
          <p class="campo">
            <label class="campo__etiqueta" for="identificador">Usuario o correo</label>
            <span class="campo__caja">
              <svg class="icono icono--sm campo__icono" aria-hidden="true"><use href="#i-usuario" /></svg>
              <input
                class="campo__control"
                id="identificador"
                name="identificador"
                type="text"
                autocomplete="username"
                placeholder="nombre@geonet.ve"
                required
              />
            </span>
            <span class="campo__error" id="identificador-error"></span>
          </p>

          <p class="campo">
            <label class="campo__etiqueta" for="clave">Contraseña</label>
            <span class="campo__caja">
              <svg class="icono icono--sm campo__icono" aria-hidden="true"><use href="#i-candado" /></svg>
              <input
                class="campo__control"
                id="clave"
                name="clave"
                type="password"
                autocomplete="current-password"
                placeholder="Tu contraseña"
                required
              />
              <button type="button" class="campo__ojo" aria-label="Mostrar contraseña">
                <svg class="icono icono--sm" aria-hidden="true"><use href="#i-ojo" /></svg>
              </button>
            </span>
            <span class="campo__error" id="clave-error"></span>
          </p>

          <p class="fila-opciones">
            <label class="marca">
              <input type="checkbox" name="recordar" /> Recordar sesión
            </label>
            <button type="button" class="enlace-apoyo" data-recuperar>¿Olvidaste tu contraseña?</button>
          </p>

          <button type="submit" class="btn btn--primario btn--bloque">Ingresar</button>
        </form>

        <p class="credenciales">
          <svg class="icono icono--sm" aria-hidden="true"><use href="#i-info" /></svg>
          <span>Prueba con el usuario <code>eduno</code> y la contraseña <code>geonet2026</code></span>
        </p>

        <footer class="pie-acceso">
          <p class="pie-acceso__separador"><span>¿No tienes cuenta?</span></p>
          <a class="btn btn--secundario btn--bloque" href="registro.html">
            Crear una cuenta
          </a>
        </footer>
      </main>
    </div>

    <output class="toasts" aria-live="polite"></output>

    <script src="script.js" defer></script>
  </body>
</html>
